name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # PHASE 1 - BUILD AND TEST
  # ============================================================

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24


      # --------------------------------------------------------
      # AUTH SERVICE
      # --------------------------------------------------------

      - name: Install Auth Service dependencies
        working-directory: backend/services/auth-service
        run: npm ci

      - name: Build Auth Service
        working-directory: backend/services/auth-service
        run: npm run build --if-present


      # --------------------------------------------------------
      # EXPENSE SERVICE
      # --------------------------------------------------------

      - name: Install Expense Service dependencies
        working-directory: backend/services/expense-service
        run: npm ci

      - name: Build Expense Service
        working-directory: backend/services/expense-service
        run: npm run build --if-present


      # --------------------------------------------------------
      # ANALYTICS SERVICE
      # --------------------------------------------------------

      - name: Install Analytics Service dependencies
        working-directory: backend/services/analytics-service
        run: npm ci

      - name: Build Analytics Service
        working-directory: backend/services/analytics-service
        run: npm run build --if-present


      # --------------------------------------------------------
      # API GATEWAY
      # --------------------------------------------------------

      - name: Install API Gateway dependencies
        working-directory: backend/services/api-gateway
        run: npm ci

      - name: Build API Gateway
        working-directory: backend/services/api-gateway
        run: npm run build --if-present


  # ============================================================
  # PHASE 2 - SONARCLOUD SAST
  # ============================================================

  sonarqube:
    name: SonarCloud SAST
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # SonarCloud Scan
      # --------------------------------------------------------

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io


      # --------------------------------------------------------
      # Verify SonarCloud Authentication
      # --------------------------------------------------------

      - name: Verify SonarCloud Authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          echo "========================================="
          echo "Testing SonarCloud authentication"
          echo "========================================="

          curl --fail --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            https://sonarcloud.io/api/authentication/validate

          echo
          echo "SonarCloud authentication successful"


      # --------------------------------------------------------
      # Debug SonarCloud Quality Gate
      # --------------------------------------------------------

      - name: Debug SonarCloud Quality Gate Access
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          echo
          echo "========================================="
          echo "Reading SonarCloud analysis information"
          echo "========================================="

          if [ ! -f ".scannerwork/report-task.txt" ]; then
            echo "ERROR: .scannerwork/report-task.txt not found"
            exit 1
          fi

          CE_TASK_URL=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)

          if [ -z "$CE_TASK_URL" ]; then
            echo "ERROR: ceTaskUrl not found"
            exit 1
          fi

          echo "CE Task URL found"


          echo
          echo "========================================="
          echo "Waiting for SonarCloud analysis"
          echo "========================================="

          ANALYSIS_ID=""

          for i in {1..30}; do

            RESPONSE=$(curl --fail --silent --show-error \
              -u "${SONAR_TOKEN}:" \
              "$CE_TASK_URL")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status')

            echo "Analysis status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.task.analysisId')
              break
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "ERROR: SonarCloud analysis failed"
              echo "$RESPONSE"
              exit 1
            fi

            sleep 10

          done


          if [ -z "$ANALYSIS_ID" ] || [ "$ANALYSIS_ID" = "null" ]; then
            echo "ERROR: SonarCloud analysis did not complete"
            exit 1
          fi


          echo
          echo "Analysis ID:"
          echo "$ANALYSIS_ID"


          echo
          echo "========================================="
          echo "Checking SonarCloud Quality Gate API"
          echo "========================================="

          curl -i \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}"


  # ============================================================
  # PHASE 3 - SOFTWARE COMPOSITION ANALYSIS
  # ============================================================

  sca:
    name: SCA - Dependency Security
    needs: sonarqube
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - expense-service
          - analytics-service
          - api-gateway

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24


      # --------------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci


      # --------------------------------------------------------
      # NPM Audit
      # --------------------------------------------------------

      - name: Run npm audit
        working-directory: backend/services/${{ matrix.service }}
        run: npm audit --audit-level=high


  # ============================================================
  # PHASE 4 - DOCKER BUILD + TRIVY
  # ============================================================

  docker-security:
    name: Docker Build and Trivy Scan
    needs: sca
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - expense-service
          - analytics-service
          - api-gateway

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5


      # --------------------------------------------------------
      # Docker Build
      # --------------------------------------------------------

      - name: Build Docker image
        working-directory: backend/services/${{ matrix.service }}
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            .


      # --------------------------------------------------------
      # Verify Docker Image
      # --------------------------------------------------------

      - name: Verify Docker image
        run: |
          docker images

          docker image inspect \
            ${{ matrix.service }}:${{ github.sha }}


      # --------------------------------------------------------
      # Trivy Container Security Scan
      # --------------------------------------------------------

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
