name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # PHASE 1 - BUILD
  # ============================================================

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # --------------------------------------------------------
      # Auth Service
      # --------------------------------------------------------

      - name: Install Auth Service dependencies
        working-directory: backend/services/auth-service
        run: npm ci

      - name: Build Auth Service
        working-directory: backend/services/auth-service
        run: npm run build --if-present

      # --------------------------------------------------------
      # Expense Service
      # --------------------------------------------------------

      - name: Install Expense Service dependencies
        working-directory: backend/services/expense-service
        run: npm ci

      - name: Build Expense Service
        working-directory: backend/services/expense-service
        run: npm run build --if-present

      # --------------------------------------------------------
      # Analytics Service
      # --------------------------------------------------------

      - name: Install Analytics Service dependencies
        working-directory: backend/services/analytics-service
        run: npm ci

      - name: Build Analytics Service
        working-directory: backend/services/analytics-service
        run: npm run build --if-present

      # --------------------------------------------------------
      # API Gateway
      # --------------------------------------------------------

      - name: Install API Gateway dependencies
        working-directory: backend/services/api-gateway
        run: npm ci

      - name: Build API Gateway
        working-directory: backend/services/api-gateway
        run: npm run build --if-present


  # ============================================================
  # PHASE 2 - SONARCLOUD SAST
  # ============================================================

  sonarqube:
    name: SonarCloud SAST
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # SonarCloud Scan
      # --------------------------------------------------------

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # --------------------------------------------------------
      # Verify SonarCloud Authentication
      # --------------------------------------------------------

      - name: Verify SonarCloud Authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Testing SonarCloud authentication..."

          curl --fail --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            https://sonarcloud.io/api/authentication/validate

          echo
          echo "SonarCloud authentication successful"

      # --------------------------------------------------------
      # Wait for SonarCloud Analysis
      # --------------------------------------------------------

      - name: Check SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          echo "Reading SonarCloud analysis information..."

          if [ ! -f ".scannerwork/report-task.txt" ]; then
            echo "ERROR: .scannerwork/report-task.txt not found"
            exit 1
          fi

          CE_TASK_URL=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)

          if [ -z "$CE_TASK_URL" ]; then
            echo "ERROR: ceTaskUrl not found"
            exit 1
          fi

          echo "CE Task URL found"

          echo "Waiting for SonarCloud analysis..."

          for i in {1..30}; do

            RESPONSE=$(curl --fail --silent --show-error \
              -u "${SONAR_TOKEN}:" \
              "$CE_TASK_URL")

            STATUS=$(echo "$RESPONSE" | jq -r '.task.status')

            echo "Analysis status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.task.analysisId')
              break
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "ERROR: SonarCloud analysis failed"
              echo "$RESPONSE"
              exit 1
            fi

            sleep 10

          done

          if [ -z "$ANALYSIS_ID" ]; then
            echo "ERROR: SonarCloud analysis did not complete"
            exit 1
          fi

          echo "Analysis ID: $ANALYSIS_ID"

          echo "Checking SonarCloud Quality Gate..."

          QUALITY_GATE=$(curl --fail --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}")

          echo "$QUALITY_GATE" | jq .

          QUALITY_STATUS=$(echo "$QUALITY_GATE" | jq -r '.projectStatus.status')

          echo "Quality Gate Status: $QUALITY_STATUS"

          if [ "$QUALITY_STATUS" != "OK" ]; then
            echo "ERROR: SonarCloud Quality Gate failed"
            exit 1
          fi

          echo "SonarCloud Quality Gate passed successfully"


  # ============================================================
  # PHASE 3 - SOFTWARE COMPOSITION ANALYSIS
  # ============================================================

  sca:
    name: SCA - Dependency Security
    needs: sonarqube
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - expense-service
          - analytics-service
          - api-gateway

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci

      - name: Run npm audit
        working-directory: backend/services/${{ matrix.service }}
        run: npm audit --audit-level=high


  # ============================================================
  # PHASE 4 - DOCKER BUILD + TRIVY
  # ============================================================

  docker-security:
    name: Docker Build and Trivy Scan
    needs: sca
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - expense-service
          - analytics-service
          - api-gateway

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      # --------------------------------------------------------
      # Docker Build
      # --------------------------------------------------------

      - name: Build Docker image
        working-directory: backend/services/${{ matrix.service }}
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            .

      # --------------------------------------------------------
      # Verify Docker Image
      # --------------------------------------------------------

      - name: Verify Docker image
        run: |
          docker images
          docker image inspect ${{ matrix.service }}:${{ github.sha }}

      # --------------------------------------------------------
      # Trivy Container Scan
      # --------------------------------------------------------

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
