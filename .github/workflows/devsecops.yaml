name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================
  # PHASE 1 - BUILD
  # ==========================================

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/services/auth-service/package-lock.json
            backend/services/expense-service/package-lock.json
            backend/services/analytics-service/package-lock.json
            backend/services/api-gateway/package-lock.json


      # ------------------------------------------
      # Auth Service
      # ------------------------------------------

      - name: Install Auth Service dependencies
        working-directory: backend/services/auth-service
        run: npm ci


      # ------------------------------------------
      # Expense Service
      # ------------------------------------------

      - name: Install Expense Service dependencies
        working-directory: backend/services/expense-service
        run: npm ci


      # ------------------------------------------
      # Analytics Service
      # ------------------------------------------

      - name: Install Analytics Service dependencies
        working-directory: backend/services/analytics-service
        run: npm ci


      # ------------------------------------------
      # API Gateway
      # ------------------------------------------

      - name: Install API Gateway dependencies
        working-directory: backend/services/api-gateway
        run: npm ci


      # ------------------------------------------
      # NOTE
      # ------------------------------------------
      # Your services currently do not have an
      # "npm test" script.
      #
      # Therefore npm test is intentionally not
      # executed.
      #
      # npm ci verifies that package.json and
      # package-lock.json can install successfully.
      #
      # Later, after adding Jest/Vitest tests,
      # we can add npm test.
      # ------------------------------------------


  # ==========================================
  # PHASE 2 - SONARCLOUD SAST
  # ==========================================

  sonarqube:
    name: SonarQube Cloud SAST
    needs: build-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------
      # SonarCloud Scan
      # ------------------------------------------

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io


      # ------------------------------------------
      # SonarCloud Quality Gate
      # ------------------------------------------

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io


  # ==========================================
  # PHASE 3 - SCA
  # ==========================================

  sca:
    name: Software Composition Analysis
    needs: sonarqube
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - expense-service
          - analytics-service
          - api-gateway

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ------------------------------------------
      # Install dependencies
      # ------------------------------------------

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci


      # ------------------------------------------
      # NPM Audit / SCA
      # ------------------------------------------

      - name: Run npm audit
        working-directory: backend/services/${{ matrix.service }}
        run: npm audit --audit-level=high


  # ==========================================
  # PHASE 4 - DOCKER BUILD + TRIVY
  # ==========================================

  docker-security:
    name: Docker Build and Trivy Scan
    needs: sca
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - expense-service
          - analytics-service
          - api-gateway

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------
      # Build Docker image
      # ------------------------------------------

      - name: Build Docker image
        working-directory: backend/services/${{ matrix.service }}
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            .


      # ------------------------------------------
      # Verify Docker image
      # ------------------------------------------

      - name: Verify Docker image
        run: |
          docker images
          docker image inspect ${{ matrix.service }}:${{ github.sha }}


      # ------------------------------------------
      # Trivy vulnerability scan
      # ------------------------------------------

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
