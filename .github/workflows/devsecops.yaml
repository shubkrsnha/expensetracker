name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # PHASE 1 - BUILD & VALIDATION
  # ==========================================

  build-test:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/services/auth-service/package-lock.json
            backend/services/expense-service/package-lock.json
            backend/services/analytics-service/package-lock.json
            backend/services/api-gateway/package-lock.json

      # ------------------------------------------
      # AUTH SERVICE
      # ------------------------------------------

      - name: Install Auth Service dependencies
        working-directory: backend/services/auth-service
        run: npm ci

      - name: Validate Auth Service
        working-directory: backend/services/auth-service
        run: node --check server.js

      # ------------------------------------------
      # EXPENSE SERVICE
      # ------------------------------------------

      - name: Install Expense Service dependencies
        working-directory: backend/services/expense-service
        run: npm ci

      - name: Validate Expense Service
        working-directory: backend/services/expense-service
        run: node --check server.js

      # ------------------------------------------
      # ANALYTICS SERVICE
      # ------------------------------------------

      - name: Install Analytics Service dependencies
        working-directory: backend/services/analytics-service
        run: npm ci

      - name: Validate Analytics Service
        working-directory: backend/services/analytics-service
        run: node --check server.js

      # ------------------------------------------
      # API GATEWAY
      # ------------------------------------------

      - name: Install API Gateway dependencies
        working-directory: backend/services/api-gateway
        run: npm ci

      - name: Validate API Gateway
        working-directory: backend/services/api-gateway
        run: node --check server.js


  # ==========================================
# PHASE 2 - SONARQUBE CLOUD SAST
# ==========================================

sonarqube:
  name: SonarQube Cloud SAST
  needs: build-test
  runs-on: ubuntu-latest

  steps:

    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

    - name: SonarQube Quality Gate
      uses: SonarSource/sonarqube-quality-gate-action@v1
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        
  # ==========================================
  # PHASE 3 - SCA
  # ==========================================

  sca:
    name: Software Composition Analysis
    needs: sonarqube
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - expense-service
          - analytics-service
          - api-gateway

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci

      - name: Run npm audit
        working-directory: backend/services/${{ matrix.service }}
        run: npm audit --audit-level=high
