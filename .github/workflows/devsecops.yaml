name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # PHASE 1 - BUILD
  # ==========================================

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/services/auth-service/package-lock.json
            backend/services/expense-service/package-lock.json
            backend/services/analytics-service/package-lock.json
            backend/services/api-gateway/package-lock.json

      # ------------------------------------------
      # Auth Service
      # ------------------------------------------

      - name: Install Auth Service dependencies
        working-directory: backend/services/auth-service
        run: npm ci

      # ------------------------------------------
      # Expense Service
      # ------------------------------------------

      - name: Install Expense Service dependencies
        working-directory: backend/services/expense-service
        run: npm ci

      # ------------------------------------------
      # Analytics Service
      # ------------------------------------------

      - name: Install Analytics Service dependencies
        working-directory: backend/services/analytics-service
        run: npm ci

      # ------------------------------------------
      # API Gateway
      # ------------------------------------------

      - name: Install API Gateway dependencies
        working-directory: backend/services/api-gateway
        run: npm ci

      # ------------------------------------------
      # IMPORTANT
      # ------------------------------------------
      # Your services currently do not have an
      # "npm test" script.
      #
      # Therefore we are NOT running npm test.
      #
      # npm ci verifies that package-lock.json
      # and package.json can install successfully.
      #
      # Later we can add Jest/Vitest tests and
      # enable npm test here.
      # ------------------------------------------


  # ==========================================
  # PHASE 2 - SONARCLOUD SAST
  # ==========================================

  sonarqube:
    name: SonarQube Cloud SAST
    needs: build-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------
      # SonarCloud Scan
      # ------------------------------------------

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ------------------------------------------
      # Verify SonarCloud authentication
      # ------------------------------------------

      - name: Test SonarCloud Authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Testing SonarCloud authentication..."

          curl --fail --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            https://sonarcloud.io/api/authentication/validate

          echo
          echo "SonarCloud authentication successful"

      # ------------------------------------------
      # Show Sonar analysis task
      # ------------------------------------------

      - name: Show Sonar Analysis Task
        run: |
          echo "===== Sonar Analysis Task ====="
          cat .scannerwork/report-task.txt

      # ------------------------------------------
      # SonarCloud Quality Gate
      # ------------------------------------------

      - name: SonarQube Quality Gate Debug
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "SonarCloud Quality Gate Debug"
          echo "======================================"

          echo ""
          echo "1. Checking authentication..."

          curl --fail --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            https://sonarcloud.io/api/authentication/validate

          echo ""
          echo "Authentication successful"

          echo ""
          echo "2. Reading Sonar analysis task..."

          if [ ! -f ".scannerwork/report-task.txt" ]; then
            echo "ERROR: report-task.txt not found"
            exit 1
          fi

          cat .scannerwork/report-task.txt

          echo ""
          echo "3. Getting CE Task URL..."

          CE_TASK_URL=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)

          if [ -z "$CE_TASK_URL" ]; then
            echo "ERROR: ceTaskUrl not found"
            exit 1
          fi

          echo "CE task URL found"

          echo ""
          echo "4. Checking CE task..."

          TASK_RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --user "${SONAR_TOKEN}:" \
            "${CE_TASK_URL}")

          echo "$TASK_RESPONSE"

          ANALYSIS_ID=$(echo "$TASK_RESPONSE" | jq -r '.task.analysisId')

          if [ "$ANALYSIS_ID" = "null" ] || [ -z "$ANALYSIS_ID" ]; then
            echo "ERROR: Analysis ID was not returned"
            exit 1
          fi

          echo ""
          echo "Analysis ID received"

          echo ""
          echo "5. Checking Quality Gate..."

          QUALITY_GATE_URL="https://sonarcloud.io/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}"

          echo "Calling SonarCloud Quality Gate API..."

          curl \
            --silent \
            --show-error \
            --fail \
            --user "${SONAR_TOKEN}:" \
            "${QUALITY_GATE_URL}" | jq .

          echo ""
          echo "Quality Gate API request successful"



  # ==========================================
  # PHASE 3 - SCA
  # ==========================================

  sca:
    name: Software Composition Analysis
    needs: sonarqube
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - expense-service
          - analytics-service
          - api-gateway

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ------------------------------------------
      # Install dependencies
      # ------------------------------------------

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: npm ci

      # ------------------------------------------
      # NPM Audit / SCA
      # ------------------------------------------

      - name: Run npm audit
        working-directory: backend/services/${{ matrix.service }}
        run: npm audit --audit-level=high

    # ==========================================
    # PHASE 4 - DOCKER BUILD + TRIVY
    # ==========================================
  
      docker-security:
      name: Docker Build and Trivy Scan
      needs: sca
      runs-on: ubuntu-latest
  
      strategy:
        matrix:
          service:
            - auth-service
            - expense-service
            - analytics-service
            - api-gateway
  
      steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # DOCKER BUILD
      # ==========================================

      - name: Build Docker image
        working-directory: backend/services/${{ matrix.service }}
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            .


      # ==========================================
      # VERIFY IMAGE
      # ==========================================

      - name: Verify Docker image
        run: |
          docker images
          docker image inspect ${{ matrix.service }}:${{ github.sha }}


      # ==========================================
      # TRIVY SCAN
      # ==========================================

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

